# FlightBuddy-Server (iOS-Backend): airplanes.live → Ereignisse → APNs.
# Image kommt aus GHCR (wie bisher). Lokal bauen: docker compose -f docker-compose.yml -f docker-compose.build.yml build
# Die .p8-Datei wird nur lesend eingebunden und gehört weder ins Image noch ins Repo.
services:
  flightbuddy-server:
    image: ghcr.io/rolfwalker71-commits/flightbuddy-server:${TAG:-latest}
    container_name: flightbuddy-server
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/flightbuddy.sqlite
      APNS_KEY_PATH: /run/secrets/apns.p8
    ports:
      - "127.0.0.1:${PORT:-8787}:8787"   # nur lokal; von aussen über den Reverse-Proxy mit TLS
    volumes:
      - ./data:/data
      - ${APNS_KEY_HOST_PATH:?Pfad der AuthKey_XXXX.p8 auf dem Host setzen}:/run/secrets/apns.p8:ro
